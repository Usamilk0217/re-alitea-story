<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ao·第2话 记忆深处残留的事物</title>
<meta name="theme-color" content="#15161d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2315161d'/%3E%3Cpath d='M5 9h17l-4 14H2z' fill='%2389bc3e'/%3E%3Cpath d='M14 9h17l-4 14h-16z' fill='%234f3f78'/%3E%3C/svg%3E">
<style>
  @font-face{
    font-family:"SourceHanSC";
    src:url("assets/SourceHanSansSC-Medium.woff2") format("woff2");
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:"YuGothicWeb";
    src:url("assets/YuGothic-Bold.woff2") format("woff2");
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:"Bacchus";
    src:url("Bacchus-Light-2.ttf") format("truetype");
    font-weight:400;
    font-style:normal;
    font-display:swap;
  }

  :root{
    --bg:#15161d;
    --panel:#1d1f28;
    --ink:#ffffff;
    --ink-dim:#9aa1b0;
    --hair:rgba(255,255,255,.13);
    --gold:#c9a96b;
    --gold-soft:#d9bd8a;
    --navy:#232a42;
    --base-fs:15px;
    --notch:9px;
    --font-cn:"SourceHanSC","Source Han Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    --font-jp:"YuGothicWeb","Yu Gothic","Hiragino Sans","Meiryo","PingFang SC",sans-serif;
    --font-latin:"Bacchus","Yu Gothic","PingFang SC",sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-cn);
    -webkit-font-smoothing:antialiased;
  }
  body[data-lang="jp"]{font-family:var(--font-jp)}

  .app{
    position:relative;
    display:flex;
    flex-direction:column;
    height:100vh;
    height:100dvh;
    max-width:480px;
    margin:0 auto;
    padding:0 22px;
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(255,255,255,.045);
    user-select:none;
    touch-action:manipulation;
  }

  /* ===== 顶栏 ===== */
  .hud{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:calc(env(safe-area-inset-top) + 14px) 0 10px;
    position:relative;
    z-index:2;
    font-family:var(--font-cn);
  }
  .pill{
    display:inline-flex;
    align-items:center;
    gap:7px;
    height:40px;
    padding:0 14px;
    border:1px solid var(--hair);
    border-radius:999px;
    background:var(--panel);
    color:var(--ink);
    font-family:inherit;
    font-size:14px;
    cursor:pointer;
    transition:background .18s ease;
  }
  .pill:active{background:#262935}
  .pill svg{width:16px;height:16px;flex:0 0 auto;opacity:.75}
  .pill .who{max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .seg{
    display:inline-flex;
    align-items:center;
    gap:2px;
    padding:3px;
    border:1px solid var(--hair);
    border-radius:999px;
    background:var(--panel);
  }
  .seg button{
    min-width:62px;
    height:34px;
    padding:0 10px;
    border:0;
    border-radius:999px;
    background:transparent;
    color:var(--ink-dim);
    font-family:inherit;
    font-size:13px;
    letter-spacing:.06em;
    cursor:pointer;
    transition:color .18s ease, background .18s ease;
  }
  .seg button[aria-pressed="true"]{background:#2f3342;color:#fff}

  /* ===== 正文 ===== */
  .transcript{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:6px 0 104px;
    scrollbar-width:none;
    -ms-overflow-style:none;
    overscroll-behavior:contain;
  }
  .transcript::-webkit-scrollbar{display:none}

  .line{margin-bottom:30px;--fs:var(--base-fs)}

  /* 缎带名牌：矩形 + 右端内凹的旗尾 */
  .tag{
    display:inline-flex;
    align-items:center;
    height:26px;
    padding:0 24px 0 12px;
    background:var(--c);
    color:var(--c-ink,#fff);
    font-size:var(--base-fs);
    line-height:1;
    letter-spacing:.09em;
    clip-path:polygon(0 0, 100% 0, calc(100% - var(--notch)) 50%, 100% 100%, 0 100%);
    text-shadow:var(--c-ts,0 1px 0 rgba(0,0,0,.3));
  }

  /* 默认字号与名字一致，只有情绪上来的句子才变大 */
  .say{
    margin-top:15px;
    font-size:var(--fs);
    line-height:1.8;
    letter-spacing:.02em;
    white-space:pre-wrap;
    word-break:break-word;
    text-shadow:0 1px 3px rgba(0,0,0,.45);
  }
  .line.lv1{--fs:19px}
  .line.lv2{--fs:23px}
  .line.lv2 .say{line-height:1.68}

  @keyframes cardIn{
    from{opacity:0;transform:translateY(14px) scale(.986)}
    to{opacity:1;transform:none}
  }
  @keyframes bodyIn{from{opacity:0}to{opacity:1}}

  /* ===== 剧情插图：横幅切入，右进渐显 → 停留 0.6s → 左出渐隐 ===== */
  .cgcard{
    position:relative;
    margin:2px 0 28px -22px;
    width:calc(100% + 44px);
    height:clamp(150px, 30vh, 230px);
    overflow:hidden;
    background:transparent;
    mask-image:linear-gradient(180deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
    -webkit-mask-image:linear-gradient(180deg, transparent 0%, #000 18%, #000 82%, transparent 100%);
  }
  .cgcard img{display:block;width:100%;height:100%;object-fit:cover}
  .cgcard.run{animation:cgRun 1.75s cubic-bezier(.22,.61,.36,1) both}
  @keyframes cgRun{
    0%{opacity:0;transform:translateX(22%)}
    32%{opacity:1;transform:translateX(0)}
    68%{opacity:1;transform:translateX(0)}
    100%{opacity:0;transform:translateX(-22%)}
  }

  /* ===== 题记 ===== */
  .quotecard{
    margin:6px 0 26px;
    padding:24px 14px;
    text-align:center;
    animation:cardIn 2.7s cubic-bezier(.16,.62,.2,1) both;
  }
  .quotecard.no-anim,
  .quotecard.finish,
  .quotecard.finish .qc-body{animation:none}
  .qc-body{animation:bodyIn 1.9s ease 1s both}
  .qc-rule{
    height:1px;
    background:linear-gradient(90deg, rgba(201,169,107,0), rgba(201,169,107,.55), rgba(201,169,107,0));
  }
  .qc-text{
    margin:18px 0;
    color:#d8bf8f;
    font-size:clamp(16px,4.3vw,20px);
    line-height:1.9;
    letter-spacing:.05em;
    white-space:pre-wrap;
  }

  /* ===== 地点切换框：白色横条 + 金色细线 + 星芒 ===== */
  .placecard{
    position:relative;
    margin:2px 0 26px;
    padding:19px 26px 13px;
    border-radius:20px;
    background:#fcfdff;
    box-shadow:0 18px 40px rgba(0,0,0,.42), 0 0 0 1px rgba(255,255,255,.55) inset;
    text-align:center;
    animation:cardIn 2.7s cubic-bezier(.16,.62,.2,1) both;
    isolation:isolate;
  }
  .placecard.no-anim,
  .placecard.finish,
  .placecard.finish .pc-body{animation:none}
  .pc-body{
    position:relative;
    z-index:2;
    animation:bodyIn 1.9s ease 1s both;
  }
  .pc-name{
    margin:0;
    color:var(--navy);
    font-size:clamp(17px,4.7vw,23px);
    font-weight:700;
    line-height:1.5;
    letter-spacing:.045em;
    white-space:pre-wrap;
  }
  .pc-name.small{font-size:clamp(13px,3.8vw,17px);line-height:1.7}
  .pc-rule{
    display:flex;
    align-items:center;
    width:74%;
    margin:11px auto 0;
    gap:9px;
  }
  .pc-rule span{
    flex:1 1 auto;
    height:1px;
    background:linear-gradient(90deg, rgba(201,169,107,0) 0%, rgba(201,169,107,.85) 30%, rgba(201,169,107,.85) 70%, rgba(201,169,107,0) 100%);
  }
  .pc-rule i{
    width:5px;
    height:5px;
    background:var(--gold);
    transform:rotate(45deg);
    flex:0 0 auto;
  }
  .pc-spark{position:absolute;z-index:1;pointer-events:none}

  /* ===== 标题框：蓝白 ===== */
  .titlecard{
    position:relative;
    margin:2px 0 34px;
    height:clamp(232px, 33vh, 286px);
    border-radius:8px;
    overflow:hidden;
    background:#f7f8fb;
    box-shadow:0 10px 30px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.1);
    animation:cardIn 2.7s cubic-bezier(.16,.62,.2,1) both;
    isolation:isolate;
  }
  .titlecard.no-anim,
  .titlecard.finish,
  .titlecard.finish .tc-body{animation:none}
  .tc-wave{
    position:absolute;
    left:0;
    width:100%;
    height:34px;
    z-index:0;
  }
  .tc-wave.top{top:0}
  .tc-wave.bottom{bottom:0}
  .tc-glow{
    position:absolute;
    inset:0;
    background:radial-gradient(120% 70% at 50% 45%, #ffffff 35%, rgba(247,248,251,0) 70%);
    z-index:0;
  }
  .tc-star{position:absolute;z-index:1;pointer-events:none}
  .tc-body{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px 24px 36px;
    text-align:center;
    animation:bodyIn 1.9s ease 1s both;
  }
  .tc-type{
    margin:0;
    color:#bfa06a;
    font-size:12px;
    letter-spacing:.2em;
  }
  .tc-cast{
    margin:1px 0 0;
    color:#c9ad7d;
    font-size:11px;
    letter-spacing:.14em;
  }
  .tc-rule{
    display:flex;
    align-items:center;
    gap:10px;
    width:78%;
    margin:2px 0 11px;
  }
  .tc-rule span{
    flex:1 1 auto;
    height:1px;
    background:linear-gradient(90deg, rgba(206,177,131,0) 0%, #ceb183 22%, #ceb183 78%, rgba(206,177,131,0) 100%);
  }
  .tc-rule i{
    width:5px;
    height:5px;
    background:#c9a76b;
    transform:rotate(45deg);
    flex:0 0 auto;
  }
  .tc-ep{
    display:flex;
    align-items:center;
    gap:12px;
    margin:0;
    color:#bfa06a;
    font-size:17px;
    letter-spacing:.1em;
  }
  .tc-ep .fl{width:34px;height:13px;flex:0 0 auto}
  .tc-ep .fl.left{transform:scaleX(-1)}
  .tc-title{
    margin:6px 0 0;
    color:#1d2a45;
    font-size:20px;
    line-height:1.3;
    letter-spacing:.06em;
    font-weight:700;
  }

  .tc-type,
  .tc-cast,
  .tc-rule{position:relative;top:-4px}
  .tc-ep,
  .tc-title{position:relative;top:-2px}

  /* ===== 点选框：白色胶囊 + 金色星芒 ===== */
  .choicebox{
    margin:2px 0 32px;
    display:flex;
    flex-direction:column;
    gap:20px;
    animation:boxIn .35s ease both;
  }
  .choicebox.gone{animation:boxOut .28s ease both}
  @keyframes boxIn{from{opacity:0}to{opacity:1}}
  @keyframes boxOut{from{opacity:1}to{opacity:0;transform:translateY(-4px)}}

  .opt{
    position:relative;
    display:block;
    width:100%;
    min-height:47px;
    padding:9px 56px 9px 22px;
    border:1px solid rgba(214,222,236,.95);
    border-radius:999px;
    background:linear-gradient(180deg,#ffffff 0%,#f2f8fe 52%,#dfeafa 100%);
    color:#242a3d;
    font-family:inherit;
    font-size:var(--base-fs);
    line-height:1.55;
    letter-spacing:.02em;
    text-align:left;
    box-shadow:0 10px 22px rgba(0,0,0,.34), 0 1px 0 rgba(255,255,255,.9) inset;
    cursor:pointer;
    animation:optIn .5s cubic-bezier(.2,.8,.3,1) backwards;
    transition:transform .12s ease;
  }
  .opt:active{transform:scale(.985)}
  @keyframes optIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .opt .spark{
    position:absolute;
    right:16px;
    top:50%;
    transform:translateY(-50%);
    width:34px;
    height:34px;
    opacity:.85;
    pointer-events:none;
  }

  /* ===== 结尾 ===== */
  .end{
    margin:10px 0 6px;
    display:flex;
    justify-content:flex-end;
    animation:rise .6s ease both;
  }
  .end .tc{
    margin:0;
    color:var(--gold-soft);
    font-family:var(--font-latin);
    font-size:15px;
    letter-spacing:.14em;
    text-shadow:0 1px 6px rgba(201,169,107,.35);
  }
  .end .mark{margin:0;color:#767d8c;font-size:14px;letter-spacing:.28em}

  /* 结尾再点一下出现的「继续阅读」 */
  .nextlink{
    margin:4px 0 40px;
    display:flex;
    justify-content:flex-end;
    animation:rise .7s ease both;
  }
  .nextlink a{
    display:inline-block;
    padding:9px 16px 8px;
    color:var(--gold-soft);
    font-size:14px;
    line-height:1.5;
    letter-spacing:.08em;
    text-decoration:none;
    border:1px solid rgba(201,169,107,.42);
    background:linear-gradient(180deg, rgba(211,182,129,.14), rgba(211,182,129,.05));
    -webkit-tap-highlight-color:transparent;
  }
  .nextlink a:active{background:rgba(211,182,129,.22)}
  .btn{
    height:48px;
    padding:0 22px;
    border:1px solid var(--hair);
    border-radius:999px;
    background:var(--panel);
    color:#e9ebf1;
    font-family:inherit;
    font-size:15px;
    letter-spacing:.04em;
    cursor:pointer;
  }
  .btn:active{background:#262935}
  .btn.solid{border-color:transparent;background:#eef0f5;color:#15161d}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* ===== 进度 & 关闭 ===== */
  .track{
    position:absolute;
    right:9px;
    top:50%;
    transform:translateY(-50%);
    width:2px;
    height:34vh;
    max-height:280px;
    border-radius:2px;
    background:rgba(255,255,255,.1);
    pointer-events:none;
  }
  .thumb{
    position:absolute;
    left:-1px;
    top:0;
    width:4px;
    height:24px;
    border-radius:2px;
    background:rgba(255,255,255,.8);
    transition:transform .28s ease;
  }
  .closeBtn{
    position:absolute;
    right:12px;
    bottom:calc(env(safe-area-inset-bottom) + 16px);
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(255,255,255,.14);
    border-radius:50%;
    background:rgba(255,255,255,.05);
    color:#fff;
    cursor:pointer;
    z-index:3;
  }
  .closeBtn:active{background:rgba(255,255,255,.12)}
  .closeBtn svg{width:17px;height:17px}

  /* ===== 弹层 ===== */
  .mask{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    background:rgba(6,7,11,.62);
    animation:fade .22s ease both;
  }
  .mask[hidden]{display:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  .sheet{
    width:100%;
    max-width:480px;
    max-height:92dvh;
    overflow-y:auto;
    padding:22px 22px calc(env(safe-area-inset-bottom) + 22px);
    background:#1d1f28;
    border:1px solid rgba(255,255,255,.07);
    border-bottom:0;
    border-radius:22px 22px 0 0;
    animation:up .3s cubic-bezier(.2,.8,.3,1) both;
    font-family:var(--font-cn);
  }
  .sheet[hidden]{display:none}
  @keyframes up{from{transform:translateY(24px)}to{transform:none}}

  .sheet h2{margin:0 0 4px;font-size:17px;font-weight:400;letter-spacing:.03em}
  .sheet .sub{margin:0 0 20px;color:#8c93a3;font-size:13px;line-height:1.6}

  .field{margin-bottom:16px}
  .field .label{display:block;margin-bottom:8px;color:#b9bfcd;font-size:13px;letter-spacing:.04em}
  .field input[type="text"]{
    width:100%;
    height:48px;
    padding:0 14px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:12px;
    background:#15161d;
    color:#fff;
    font-family:var(--font-cn);
    font-size:16px;
    letter-spacing:.04em;
    outline:none;
    transition:border-color .18s ease;
  }
  .field input[type="text"]:focus{border-color:#6b5a9c}
  .field.jp input[type="text"]{font-family:var(--font-jp)}

  .checkrow{display:flex;align-items:center;gap:10px;min-height:44px;margin:-2px 0 8px}
  .checkrow input{width:20px;height:20px;margin:0;accent-color:#6b5a9c}
  .checkrow label{color:#c9cedb;font-size:14px}

  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    min-width:62px;
    height:44px;
    padding:0 16px;
    border:1px solid rgba(255,255,255,.14);
    border-radius:999px;
    background:transparent;
    color:#a9b0c0;
    font-family:var(--font-jp);
    font-size:16px;
    letter-spacing:.04em;
    cursor:pointer;
    transition:all .16s ease;
  }
  .chip[aria-pressed="true"]{border-color:#8a76bd;background:rgba(79,63,120,.34);color:#fff}

  .note{margin:10px 0 0;color:#7b8291;font-size:12px;line-height:1.6}
  .field input[type="range"]{
    width:100%;
    height:44px;
    margin:0;
    accent-color:#8a76bd;
    background:transparent;
  }

  .actions{display:flex;gap:10px;margin-top:22px}
  .actions .btn{flex:1}
  .actions .btn.ghost{flex:0 0 auto;background:transparent;border-color:transparent;color:#9aa0ae}

  @media (min-width:768px){
    :root{--base-fs:16px}
    .line.lv1{--fs:20px}
    .line.lv2{--fs:25px}
  }
</style>
</head>
<body data-lang="cn">

<div class="app" id="app">
  <header class="hud">
    <button class="pill" id="btnProfile" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="12" cy="8" r="3.6"/><path d="M5 20c.6-3.9 3.4-5.8 7-5.8s6.4 1.9 7 5.8"/>
      </svg>
      <span class="who" id="whoLabel">京</span>
    </button>
    <div class="seg" id="segLang" role="group" aria-label="剧情语言">
      <button type="button" data-lang="cn" aria-pressed="true">中文</button>
      <button type="button" data-lang="jp" aria-pressed="false">日本語</button>
    </div>
  </header>

  <main class="transcript" id="transcript" aria-live="polite"></main>

  <div class="track" aria-hidden="true"><div class="thumb" id="thumb"></div></div>

  <button class="closeBtn" id="btnExit" type="button" aria-label="返回上一页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
      <path d="M6 6l12 12M18 6l-12 12"/>
    </svg>
  </button>
</div>

<!-- ===== 弹层：名字与自称 ===== -->
<div class="mask" id="mask" hidden>
  <div class="sheet" id="sheetProfile">
    <h2>你是谁</h2>

    <div class="field">
      <label class="label" for="nameCn">名字（中文）</label>
      <input id="nameCn" type="text" value="京" maxlength="12" placeholder="京" autocomplete="off" spellcheck="false">
    </div>

    <div class="checkrow">
      <input id="useJp" type="checkbox" checked>
      <label for="useJp">日文名单独设定（不勾选则沿用中文名）</label>
    </div>

    <div class="field jp" id="jpField">
      <label class="label" for="nameJp">名字（日文）</label>
      <input id="nameJp" type="text" value="キョウ" maxlength="12" placeholder="キョウ" autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <span class="label">自称（仅日文台词）</span>
      <div class="chips" id="selfChips">
        <button type="button" class="chip" data-self="私" aria-pressed="true">私</button>
        <button type="button" class="chip" data-self="俺" aria-pressed="false">俺</button>
        <button type="button" class="chip" data-self="自分" aria-pressed="false">自分</button>
        <button type="button" class="chip" data-self="僕" aria-pressed="false">僕</button>
      </div>
    </div>

    <div class="field">
      <span class="label">台词出现速度</span>
      <input id="speedRange" type="range" min="0" max="4" step="1" value="2" aria-label="台词出现速度">
    </div>

    <div class="actions">
      <button type="button" class="btn ghost" id="btnCancel">取消</button>
      <button type="button" class="btn solid" id="btnSave">确认更改</button>
    </div>

/* ---------- 存取 ---------- */
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const saved = JSON.parse(raw);
    if(typeof saved.cn === 'string' && saved.cn) settings.cn = saved.cn;
    if(typeof saved.jp === 'string' && saved.jp) settings.jp = saved.jp;
    if(typeof saved.useJp === 'boolean') settings.useJp = saved.useJp;
    if(['私','俺','自分','僕'].indexOf(saved.self) >= 0) settings.self = saved.self;
    if(typeof saved.speed === 'number' && saved.speed >= 0 && saved.speed <= 4) settings.speed = saved.speed;
    if(saved.lang === 'jp' || saved.lang === 'cn') lang = saved.lang;
  }catch(e){}
}
function persist(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify({
      cn:settings.cn, jp:settings.jp, useJp:settings.useJp, self:settings.self, lang:lang, speed:settings.speed
    }));
  }catch(e){}
}

/* ---------- 文案替换 ---------- */
function nameFor(l){
  if(l === 'jp') return (settings.useJp ? settings.jp : settings.cn) || (settings.useJp ? 'キョウ' : '京');
  return settings.cn || '京';
}
function fill(text, l){
  if(!text) return '';
  let t = text.split('{name}').join(nameFor(l));
  t = t.split('{self}').join(l === 'jp' ? settings.self : '我');
  return t;
}
function speakerName(key, l){
  const sp = SPEAKERS[key];
  return fill(l === 'jp' ? sp.jp : sp.cn, l);
}
function each(list, fn){ Array.prototype.forEach.call(list, fn); }
/* 名签文字统一白色，靠投影在浅色缎带上也读得清 */
function inkFor(){
  return '#ffffff';
}

/* =========================================================
   逐行渲染（n === null 表示直接给全文）
   ========================================================= */
function makeLine(key, text, lv, n){
  const el = document.createElement('div');
  el.className = 'line' + (lv ? ' lv' + lv : '');

  const sp = SPEAKERS[key];
  const tag = document.createElement('div');
  tag.className = 'tag';
  tag.style.setProperty('--c', sp.color);
  const ink = inkFor(sp.color);
  tag.style.setProperty('--c-ink', ink);
  tag.style.setProperty('--c-ts', ink === '#ffffff' ? '0 1px 0 rgba(0,0,0,.3)' : 'none');
  tag.textContent = speakerName(key, lang);
  el.appendChild(tag);

  const say = document.createElement('div');
  say.className = 'say';
  const txt = document.createElement('span');
  say.appendChild(txt);
  el.appendChild(say);
  transcript.appendChild(el);

  const full = text;
  txt.textContent = full.slice(0, n === null ? full.length : n);
  return {txt: txt, full: full, el: el};
}

function spark(x, y, size, opacity){
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 24 24');
  svg.setAttribute('class','pc-spark');
  svg.style.left = x;
  svg.style.top = y;
  svg.style.width = size + 'px';
  svg.style.height = size + 'px';
  svg.style.opacity = opacity;
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d', SPARK_PATH);
  p.setAttribute('fill', '#d3b681');
  svg.appendChild(p);
  return svg;
}

function wave(pos, from, to, isTop, seq){
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','tc-wave ' + pos);
  svg.setAttribute('viewBox','0 0 100 10');
  svg.setAttribute('preserveAspectRatio','none');
  svg.setAttribute('aria-hidden','true');

  const defs = document.createElementNS('http://www.w3.org/2000/svg','defs');
  const gid = 'wg-' + pos + '-' + seq;
  const grad = document.createElementNS('http://www.w3.org/2000/svg','linearGradient');
  grad.setAttribute('id', gid);
  grad.setAttribute('gradientUnits','objectBoundingBox');
  grad.setAttribute('x1','0'); grad.setAttribute('y1', isTop ? '0' : '1');
  grad.setAttribute('x2','0'); grad.setAttribute('y2', isTop ? '1' : '0');
  const s1 = document.createElementNS('http://www.w3.org/2000/svg','stop');
  s1.setAttribute('offset','0'); s1.setAttribute('stop-color', from);
  const s2 = document.createElementNS('http://www.w3.org/2000/svg','stop');
  s2.setAttribute('offset','1'); s2.setAttribute('stop-color', to);
  grad.appendChild(s1); grad.appendChild(s2);
  defs.appendChild(grad);
  svg.appendChild(defs);

  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  const d = isTop
    ? 'M0 0 H100 V4.2 C86 7.4 74 3 52 5.6 C30 8.2 16 3.2 0 4.8 Z'
    : 'M0 10 H100 V5.8 C86 2.6 74 7 52 4.4 C30 1.8 16 6.8 0 5.2 Z';
  path.setAttribute('d', d);
  path.setAttribute('fill', 'url(#' + gid + ')');
  svg.appendChild(path);
  return svg;
}

function flourish(side){
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 44 16');
  svg.setAttribute('class','fl ' + side);
  svg.setAttribute('aria-hidden','true');
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d','M40 8 L14 8 C7 8 5 12.5 8.5 12.8 C12 13 12.6 8.6 9.4 8 C6.4 7.4 3.5 9.6 2.5 12.2');
  p.setAttribute('fill','none');
  p.setAttribute('stroke','#bfa06a');
  p.setAttribute('stroke-width','1.1');
  p.setAttribute('stroke-linecap','round');
  svg.appendChild(p);
  return svg;
}

function buildTitle(animate){
  const card = document.createElement('div');
  card.className = 'titlecard' + (animate ? '' : ' no-anim');
  cardSeq++;

  const glow = document.createElement('div');
  glow.className = 'tc-glow';
  card.appendChild(glow);

  card.appendChild(wave('top', '#7fe3f5', '#c9f4fb', true, cardSeq));
  card.appendChild(wave('bottom', '#54cde9', '#c9f4fb', false, cardSeq));

  const stars = [
    {x:'6%',  y:'22%', s:26, o:.75},
    {x:'17%', y:'10%', s:13, o:.5},
    {x:'30%', y:'20%', s:8,  o:.35},
    {x:'88%', y:'24%', s:24, o:.7},
    {x:'75%', y:'9%',  s:12, o:.45},
    {x:'10%', y:'74%', s:18, o:.6},
    {x:'24%', y:'86%', s:9,  o:.35},
    {x:'92%', y:'70%', s:16, o:.55},
    {x:'70%', y:'88%', s:8,  o:.3}
  ];
  stars.forEach(function(st){
    const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 24 24');
    svg.setAttribute('class','tc-star');
    svg.style.left = st.x;
    svg.style.top = st.y;
    svg.style.width = st.s + 'px';
    svg.style.height = st.s + 'px';
    svg.style.opacity = st.o;
    const p = document.createElementNS('http://www.w3.org/2000/svg','path');
    p.setAttribute('d', DIAMOND_PATH);
    p.setAttribute('fill', '#d9bd8a');
    svg.appendChild(p);
    card.appendChild(svg);
  });

  const body = document.createElement('div');
  body.className = 'tc-body';

  const type = document.createElement('p');
  type.className = 'tc-type';
  type.textContent = TITLE.kicker[lang];
  body.appendChild(type);

  const cast = document.createElement('p');
  cast.className = 'tc-cast';
  cast.textContent = TITLE.sub[lang];
  body.appendChild(cast);

  const r = document.createElement('div');
  r.className = 'tc-rule';
  r.appendChild(document.createElement('span'));
  r.appendChild(document.createElement('i'));
  r.appendChild(document.createElement('span'));
  body.appendChild(r);

  const ep = document.createElement('p');
  ep.className = 'tc-ep';
  ep.appendChild(flourish('left'));
  const epTxt = document.createElement('span');
  epTxt.textContent = TITLE.gold[lang];
  ep.appendChild(epTxt);
  ep.appendChild(flourish('right'));
  body.appendChild(ep);

  const title = document.createElement('h3');
  title.className = 'tc-title';
  title.textContent = TITLE.main[lang];
  body.appendChild(title);

  card.appendChild(body);
  return card;
}

function buildCard(kind, animate, key){
  if(kind === 'quote') return buildQuote(animate);
  if(kind === 'place') return buildPlace(animate, key);
  return buildTitle(animate);
}

/* 插图：run 时走右进左出特效，否则静态展示（重绘用） */
function buildCg(src, animate){
  const wrap = document.createElement('div');
  wrap.className = 'cgcard' + (animate ? ' run' : '');
  const img = document.createElement('img');
  img.src = src;
  img.alt = '';
  img.setAttribute('draggable','false');
  wrap.appendChild(img);
  return wrap;
}

/* =========================================================
   点选框
   ========================================================= */
function sparkCluster(){
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 40 40');
  svg.setAttribute('class','spark');
  svg.setAttribute('aria-hidden','true');
  const specs = [
    {x:22, y:2,  s:15, o:.85},
    {x:8,  y:14, s:8,  o:.55},
    {x:27, y:22, s:6,  o:.45},
    {x:14, y:30, s:5,  o:.35}
  ];
  specs.forEach(function(sp){
    const el = document.createElementNS('http://www.w3.org/2000/svg','path');
    el.setAttribute('d', SPARK_PATH);
    el.setAttribute('fill', '#d9bd8a');
    el.setAttribute('opacity', sp.o);
    el.setAttribute('transform', 'translate(' + sp.x + ',' + sp.y + ') scale(' + (sp.s / 24) + ')');
    svg.appendChild(el);
  });
  return svg;
}

function buildChoice(id, animate){
  const data = CHOICES[id];
  const box = document.createElement('div');
  box.className = 'choicebox';
  data.options.forEach(function(opt, i){
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'opt';
    btn.style.animationDelay = (i * 0.08) + 's';
    if(!animate) btn.style.animation = 'none';

    const txt = document.createElement('span');
    txt.className = 'opt-txt';
    txt.textContent = fill(opt[lang], lang);
    btn.appendChild(txt);
    btn.appendChild(sparkCluster());

    btn.addEventListener('click', function(e){
      e.stopPropagation();
      pickChoice(id, opt);
    });
    box.appendChild(btn);
  });
  return box;
}

function openChoice(id, animate){
  state.pendingChoice = id;
  transcript.appendChild(buildChoice(id, animate !== false));
  keepBottom();
}

function pickChoice(id, opt){
  if(state.pendingChoice !== id) return;

  const box = transcript.querySelector('.choicebox');
  if(box){
    box.classList.add('gone');
    setTimeout(function(){ if(box.parentNode) box.remove(); }, 300);
  }
  state.pendingChoice = null;

  /* 选中的那句，作为主控台词接进对话 */
  state.timeline.push({kind:'chosen', opt:opt});
  const rate = SPEEDS[settings.speed] === undefined ? 1 : SPEEDS[settings.speed];
  active = makeLine('conductor', fill(opt[lang], lang), 0, rate > 0 ? 0 : null);
  state.shown = rate > 0 ? 0 : active.full.length;
  state.typing = rate > 0;

  /* 之后的支线 */
  const br = opt.branch || [];
  state.branch = br.slice();
  state.extra += br.length;

  keepBottom();
  updateProgress();
  tick();
}

/* =========================================================
   打字机
   ========================================================= */
function keepBottom(){
  if(rafQueued) return;
  rafQueued = true;
  requestAnimationFrame(function(){
    rafQueued = false;
    transcript.scrollTop = transcript.scrollHeight;
  });
}

function delayFor(ch){
  if(ch === '。' || ch === '！' || ch === '？') return 240;
  if('，、；：…—―'.indexOf(ch) >= 0) return 120;
  if(ch === '　') return 80;
  return 30;
}

function tick(){
  if(!state.typing || !active) return;
  if(state.shown >= active.full.length){ finishTyping(); return; }
  const ch = active.full[state.shown];
  state.shown++;
  active.txt.textContent = active.full.slice(0, state.shown);
  keepBottom();
  const rate = SPEEDS[settings.speed] === undefined ? 1 : SPEEDS[settings.speed];
  state.timer = setTimeout(tick, (state.shown <= 1 ? 90 : delayFor(ch)) * rate);
}

function finishTyping(){
  if(!active) return;
  clearTimeout(state.timer);
  state.typing = false;
  state.shown = active.full.length;
  active.txt.textContent = active.full;
  keepBottom();
  updateProgress();
  maybeEnd();
}

/* =========================================================
   推进：卡片也算「一句」，一次点击只出一个内容
   ========================================================= */
function playLine(ev, animateTyping){
  const rate = SPEEDS[settings.speed] === undefined ? 1 : SPEEDS[settings.speed];
  const anim = !!animateTyping && rate > 0;
  state.timeline.push({kind:'line', ev:ev});
  active = makeLine(ev.s, fill(ev[lang], lang), ev.lv || 0, anim ? 0 : null);
  state.shown = anim ? 0 : active.full.length;
  state.typing = anim;
  keepBottom();
  updateProgress();
  if(anim) tick();
}

function advance(userTap){
  if(state.pendingChoice) return;     // 等玩家点选
  if(state.cgT) return;               // 插图特效播放中，不再接受点击

  if(state.cardT && Date.now() - state.cardT < CARD_MS){ finishCard(); return; }
  if(state.typing){ finishTyping(); return; }
  if(state.ended){ showNextLink(); return; }

  /* 选项支线优先 */
  if(state.branch.length){
    const ev = state.branch.shift();
    playLine(ev, true);
    maybeEnd();
    return;
  }

  if(state.ptr >= STORY.length){ maybeEnd(); return; }

  const ev = STORY[state.ptr];

  if(ev.t === 'card'){
    state.ptr++;
    state.timeline.push({kind:'card', card:ev.kind, key:ev.key});
    const el = buildCard(ev.kind, true, ev.key);
    transcript.appendChild(el);
    state.cardEl = el;
    state.cardT = Date.now();
    keepBottom();
    updateProgress();
    return;
  }

  if(ev.t === 'choice'){
    state.ptr++;
    openChoice(ev.id, true);
    updateProgress();
    return;
  }

  /* 插图特效：和下一句算同一次点击 —— 播完自动接下一句，不用再点 */
  if(ev.t === 'cg'){
    state.ptr++;
    state.timeline.push({kind:'cg', src:ev.src});
    const g = buildCg(ev.src, true);
    transcript.appendChild(g);
    keepBottom();
    updateProgress();
    state.cgT = Date.now();
    state.cgTimer = setTimeout(function(){
      if(g.parentNode) g.remove();
      state.cgT = 0;
      state.cgTimer = null;
      advance(true);
    }, CG_MS);
    return;
  }

  state.ptr++;
  playLine(ev, true);
}

function finishCard(){
  if(state.cardEl) state.cardEl.classList.add('finish');
  state.cardEl = null;
  state.cardT = 0;
  keepBottom();
}

/* =========================================================
   结尾 / 重来
   ========================================================= */
function maybeEnd(){
  if(state.ended) return;
  if(state.typing || state.pendingChoice) return;
  if(state.ptr < STORY.length || state.branch.length) return;
  state.ended = true;
  setTimeout(function(){ if(state.ended) appendEnd(); }, 560);
}

function appendEnd(){
  const old = transcript.querySelector('.end');
  if(old) old.remove();
  const end = document.createElement('div');
  end.className = 'end';
  const mark = document.createElement('p');
  mark.className = 'tc';
  mark.textContent = 'To be continued...';
  end.appendChild(mark);
  transcript.appendChild(end);
  updateProgress();
  keepBottom();
}

/* 结尾之后再多点一下，出现下一话入口 */
function appendNextLink(){
  const old = transcript.querySelector('.nextlink');
  if(old) old.remove();
  if(!NEXT) return;
  const box = document.createElement('div');
  box.className = 'nextlink';
  const a = document.createElement('a');
  a.href = NEXT.href;
  a.textContent = '【' + (lang === 'jp' ? '続きを読む' : '继续阅读') +
    '　' + NEXT.no[lang] + '　' + NEXT.title[lang] + '】';
  box.appendChild(a);
  transcript.appendChild(box);
  keepBottom();
}

function showNextLink(){
  if(!NEXT || state.nextShown) return;
  state.nextShown = true;
  appendNextLink();
}

function startStory(){
  clearTimeout(state.timer);
  clearTimeout(state.cgTimer);
  state.cgTimer = null;
  state.run++;
  transcript.innerHTML = '';
  state.ptr = 0;
  state.extra = 0;
  state.branch = [];
  state.timeline = [];
  state.typing = false;
  state.shown = 0;
  state.pendingChoice = null;
  state.ended = false;
  state.nextShown = false;
  state.cardT = 0;
  state.cardEl = null;
  state.cgT = 0;
  active = null;
  updateProgress();
  advance(false);   // 只出第一个内容，不需要任何点击
}

/* =========================================================
   语言切换 / 改名字后的原地重绘
   ========================================================= */
function rerender(restartTyping){
  clearTimeout(state.timer);
  state.typing = false;
  transcript.innerHTML = '';
  active = null;
  state.cardT = 0;
  state.cardEl = null;
  clearTimeout(state.cgTimer);
  state.cgTimer = null;
  state.cgT = 0;

  const items = state.timeline;
  items.forEach(function(it, i){
    const isLast = i === items.length - 1;
    if(it.kind === 'card'){
      transcript.appendChild(buildCard(it.card, false, it.key));
    }else if(it.kind === 'cg'){
      transcript.appendChild(buildCg(it.src, false));
    }else if(it.kind === 'line'){
      active = makeLine(it.ev.s, fill(it.ev[lang], lang), it.ev.lv || 0, isLast && restartTyping ? 0 : null);
    }else if(it.kind === 'chosen'){
      active = makeLine('conductor', fill(it.opt[lang], lang), 0, isLast && restartTyping ? 0 : null);
    }
  });

  if(restartTyping && active){
    state.shown = 0;
    state.typing = true;
    tick();
  }else{
    state.shown = active ? active.full.length : 0;
  }

  if(state.pendingChoice) openChoice(state.pendingChoice, false);
  if(state.ended) appendEnd();
  if(state.nextShown) appendNextLink();
  updateProgress();
  keepBottom();
}

function setLang(l){
  if(l === lang) return;
  lang = l;
  document.body.dataset.lang = l;
  each(segLang.querySelectorAll('button'), function(b){
    b.setAttribute('aria-pressed', b.dataset.lang === l ? 'true' : 'false');
  });
  refreshWho();
  persist();
  rerender(state.typing);
}

/* =========================================================
   进度条
   ========================================================= */
function updateProgress(){
  const total = STORY.length + state.extra;
  const done = state.ended ? total : Math.min(total, state.ptr + (state.extra - state.branch.length));
  const p = total ? Math.max(0, Math.min(1, done / total)) : 0;
  const trackH = thumb.parentElement ? thumb.parentElement.clientHeight : 0;
  const th = 24;
  thumb.style.transform = 'translateY(' + (p * Math.max(0, trackH - th)) + 'px)';
}

/* =========================================================
   顶栏与弹层
   ========================================================= */
function refreshWho(){
  whoLabel.textContent = lang === 'jp' ? nameFor('jp') : nameFor('cn');
}

function openSheet(which){
  sheetProfile.hidden = which !== 'profile';
  mask.hidden = false;
  mask.classList.add('open');
  if(which === 'profile'){
    nameCn.value = settings.cn;
    nameJp.value = settings.jp;
    useJp.checked = settings.useJp;
    jpField.style.display = settings.useJp ? '' : 'none';
    each(selfChips.querySelectorAll('.chip'), function(c){
      c.setAttribute('aria-pressed', c.dataset.self === settings.self ? 'true' : 'false');
    });
    speedRange.value = String(settings.speed);
  }
}

function closeSheet(){
  mask.classList.remove('open');
  mask.hidden = true;
}

document.getElementById('btnProfile').addEventListener('click', function(){ openSheet('profile'); });
document.getElementById('btnExit').addEventListener('click', function(){
  location.href = '角色故事目录.html';
});
document.getElementById('btnCancel').addEventListener('click', closeSheet);

speedRange.addEventListener('input', function(){
  const v = Number(speedRange.value);
  settings.speed = (v >= 0 && v <= 4) ? v : 2;
  persist();
});

useJp.addEventListener('change', function(){
  jpField.style.display = useJp.checked ? '' : 'none';
  if(useJp.checked && !nameJp.value.trim()) nameJp.value = 'キョウ';
});

selfChips.addEventListener('click', function(e){
  const b = e.target.closest('.chip');
  if(!b) return;
  each(selfChips.querySelectorAll('.chip'), function(c){
    c.setAttribute('aria-pressed', c === b ? 'true' : 'false');
  });
});

document.getElementById('btnSave').addEventListener('click', function(){
  settings.cn = nameCn.value.trim() || '京';
  settings.useJp = useJp.checked;
  settings.jp = nameJp.value.trim() || 'キョウ';
  const picked = selfChips.querySelector('.chip[aria-pressed="true"]');
  settings.self = picked ? picked.dataset.self : '私';
  persist();
  refreshWho();
  closeSheet();
  rerender(false);
});

segLang.addEventListener('click', function(e){
  const b = e.target.closest('button[data-lang]');
  if(b) setLang(b.dataset.lang);
});

/* 点屏幕推进 */
app.addEventListener('click', function(e){
  if(e.target.closest('button')) return;
  if(!mask.hidden) return;
  advance(true);
});

transcript.addEventListener('click', function(e){
  const b = e.target.closest('[data-restart]');
  if(b){ e.stopPropagation(); startStory(); }
});

document.addEventListener('keydown', function(e){
  if(!mask.hidden){
    if(e.key === 'Escape') closeSheet();
    return;
  }
  if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); advance(true); }
});

mask.addEventListener('click', function(e){
  if(e.target === mask) closeSheet();
});

window.addEventListener('resize', function(){ updateProgress(); });

/* =========================================================
   启动
   ========================================================= */
load();
document.body.dataset.lang = lang;
each(segLang.querySelectorAll('button'), function(b){
  b.setAttribute('aria-pressed', b.dataset.lang === lang ? 'true' : 'false');
});
refreshWho();
startStory();
</script>
